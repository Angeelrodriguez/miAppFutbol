<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App del Equipo - Jugadores</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="app-topbar">
        <h1>Plantilla</h1>
    </header>

    <main class="app-content">
        <div class="cabecera-vista">
            <h2>Nuestros Jugadores</h2>
            <button class="btn-pequeno">+ Nuevo</button>
        </div>

        <div class="lista-jugadores">
            <div class="jugador-item">
                <div class="avatar">👦🏻</div>
                <div class="info-jugador">
                    <span class="nombre-jugador">Carlos García</span>
                    <span class="posicion-jugador">Delantero</span>
                </div>
                <div class="dorsal">9</div>
            </div>
            <div class="jugador-item">
                <div class="avatar">👨🏽</div>
                <div class="info-jugador">
                    <span class="nombre-jugador">David Ruiz</span>
                    <span class="posicion-jugador">Defensa</span>
                </div>
                <div class="dorsal">4</div>
            </div>
        </div>
    </main>

    <nav class="app-bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Inicio</span>
        </a>
        <a href="partidos.html" class="nav-item">
            <span class="nav-icon">📅</span>
            <span class="nav-label">Partidos</span>
        </a>
        <a href="jugadores.html" class="nav-item activo">
            <span class="nav-icon">👥</span>
            <span class="nav-label">Jugadores</span>
        </a>
    </nav>
</body>
</html>
