<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App del Equipo - Tabla</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .tabla-stats { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tabla-stats th { background-color: #007aff; color: white; padding: 12px; text-align: center; }
        .tabla-stats th:first-child { text-align: left; }
        .tabla-stats td { padding: 12px; border-bottom: 1px solid #e5e5ea; color: #1c1c1e; }
        .tabla-stats tr:last-child td { border-bottom: none; }
    </style>
</head>
<body>
    <header class="app-topbar header-con-volver">
        <a href="index.html" class="btn-volver">🔙</a>
        <h1>Clasificación</h1>
    </header>

    <main class="app-content">
        <div class="cabecera-vista">
            <h2>Ranking de Plantilla</h2>
        </div>

        <table class="tabla-stats">
            <thead>
                <tr>
                    <th>Jugador</th>
                    <th style="width: 60px;">⚽</th>
                    <th style="width: 60px;">👟</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla-stats">
                <!-- JavaScript rellenará las filas -->
            </tbody>
        </table>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
