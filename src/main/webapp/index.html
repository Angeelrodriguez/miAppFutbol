<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App del Equipo - Inicio</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="app-topbar">
        <h1>Inicio</h1>
    </header>

    <main class="app-content">
        <div class="cabecera-vista">
            <h2>Bienvenido, Míster</h2>
        </div>
        
        <!-- Tarjeta del próximo partido -->
        <div style="background: white; border-radius: 10px; padding: 15px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            <h3 style="margin-top: 0; color: #1c1c1e;">Próximo Partido</h3>
            <div id="widget-proximo-partido">
                <!-- JavaScript inyectará el partido aquí -->
            </div>
        </div>

        <!-- Botón para ir a añadir estadísticas -->
        <a href="estadisticas.html" class="btn-primario" style="display: block; text-align: center; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 0 10px 15px 10px;">
            📊 Añadir Estadísticas
        </a>
        
        <!-- NUEVO: Botón para ver la tabla -->
        <a href="tabla-estadisticas.html" class="btn-primario" style="display: block; text-align: center; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 0 10px; background-color: #34c759; border: none;">
            🏆 Ver Tabla de Goleadores
        </a>
    </main>

    <nav class="app-bottom-nav">
        <a href="index.html" class="nav-item activo">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Inicio</span>
        </a>
        <a href="partidos.html" class="nav-item">
            <span class="nav-icon">📅</span>
            <span class="nav-label">Partidos</span>
        </a>
        <a href="jugadores.html" class="nav-item">
            <span class="nav-icon">👥</span>
            <span class="nav-label">Jugadores</span>
        </a>
    </nav>

    <script src="js/app.js"></script>
</body>
</html>
