<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App del Equipo - Nuevo Jugador</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="app-topbar header-con-volver">
        <a href="jugadores.html" class="btn-volver">🔙</a>
        <h1>Nuevo Jugador</h1>
    </header>

    <main class="app-content">
        <!-- Formulario con ID para JavaScript -->
        <form class="formulario-app" id="form-jugador">
            
            <div class="form-group">
                <label for="nombre">Nombre o Apodo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Carlos" required>
            </div>

            <div class="form-group">
                <label for="dorsal">Número (Dorsal)</label>
                <input type="number" id="dorsal" name="dorsal" placeholder="Ej: 9" min="1" max="99" required>
            </div>

            <div class="form-group">
                <label for="posicion">Posición habitual</label>
                <select id="posicion" name="posicion" required>
                    <option value="" disabled selected>Selecciona una posición...</option>
                    <option value="Portero">Portero</option>
                    <option value="Defensa">Defensa</option>
                    <option value="Medio">Mediocentro</option>
                    <option value="Delantero">Delantero</option>
                </select>
            </div>

            <button type="submit" class="btn-primario btn-formulario">Guardar Jugador</button>
        </form>
    </main>

    <!-- Conexión con JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
